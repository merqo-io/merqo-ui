version: 2

# Security updates only: version-update PRs are disabled with a zero PR limit,
# while Dependabot still opens PRs for known CVEs.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
